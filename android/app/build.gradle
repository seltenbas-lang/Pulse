plugins {
    id 'com.android.application'
}

android {
    namespace 'app.pulse'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'app.pulse'
        minSdk 26
        targetSdk 35
        versionCode((System.getenv("PULSE_VERSION_CODE") ?: "1").toInteger())
        versionName System.getenv("PULSE_VERSION_NAME") ?: "2.0.0-rust"
    }

    // releases are signed with the permanent Pulse key when it is given (PULSE_KEYSTORE and its
    // passwords: see build-android.sh); Android only installs an update signed with the same key
    signingConfigs {
        release {
            if (System.getenv("PULSE_KEYSTORE")) {
                storeFile file(System.getenv("PULSE_KEYSTORE"))
                storePassword System.getenv("PULSE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PULSE_KEY_ALIAS") ?: "pulse"
                keyPassword System.getenv("PULSE_KEY_PASSWORD") ?: System.getenv("PULSE_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("PULSE_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    // the release lint pass only needs extra downloads; the Java layer is small and checked with javac -Xlint
    lint { checkReleaseBuilds false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // libpulse_app.so for each ABI, built by ../build-android.sh with cargo-ndk
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
}
