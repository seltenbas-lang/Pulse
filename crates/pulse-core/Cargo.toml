[package]
name = "pulse-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
regex = "1"
unicode-normalization = "0.1"
icu_collator = "2"
url = "2"
aes-gcm = "0.10"
sha2 = "0.10"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
