name: Build Pulse APK

# Push this folder to a GitHub repo (or run it manually from the Actions tab), then download
# the "Pulse-apk" artifact from the finished run. Debug-signed, no secrets needed: fine for
# sideloading onto your own phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the web bundle
        run: node mobile/build.mjs

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Build APK
        env:
          PULSE_VERSION_CODE: ${{ github.run_number }}
        run: |
          export PULSE_VERSION_NAME="$(node -p "require('./package.json').version")"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Pulse.apk
          ls -lh ../Pulse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-apk
          path: Pulse.apk
