name: Release

# Builds the APK, signs it with the Pulse release key and publishes it as release v<version> (the
# version in Cargo.toml); Pulse's in-app updates pick it up from there. Start it from the Actions tab:
# Release -> Run workflow, with "Publish as a release" ticked (or push a tag v<version>).
# One-time setup, in Settings → Secrets and variables → Actions:
#   PULSE_KEYSTORE_BASE64     the release keystore, base64-encoded
#   PULSE_KEYSTORE_PASSWORD   its password
# "Run workflow" publishes by default, as a pre-release (beta): phones with Settings > About > "Get
# beta versions" on get it. To make a beta the version everyone gets, edit the release on GitHub and
# untick "Set as a pre-release". Unticking "Publish" only builds and keeps the APK as a run download.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish as a release (v<version> from Cargo.toml); untick to only build
        type: boolean
        default: true
      prerelease:
        description: Pre-release (beta) - for bug fixes; phones get it with "Get beta versions" on
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          v=$(./bump-version.sh --show)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match the version in Cargo.toml ($v)"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Android NDK r30 and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.PULSE_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.PULSE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "${GITHUB_REF_TYPE}" = tag ] || [ "${{ inputs.publish }}" = true ]; then
              echo "::error::the PULSE_KEYSTORE_BASE64 secret is missing (Settings -> Secrets and variables -> Actions)"; exit 1
            fi
            echo "::warning::no signing key: this build is signed with a debug key and can't update an installed Pulse"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pulse-release.jks"
          {
            echo "PULSE_KEYSTORE=$RUNNER_TEMP/pulse-release.jks"
            echo "PULSE_KEYSTORE_PASSWORD=$KEYSTORE_PW"
            echo "PULSE_KEY_ALIAS=pulse"
            echo "PULSE_KEY_PASSWORD=$KEYSTORE_PW"
          } > "$RUNNER_TEMP/signing.env"
          echo "PULSE_SIGNING_ENV=$RUNNER_TEMP/signing.env" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cargo install cargo-ndk --locked
          ./build-android.sh release

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ steps.v.outputs.version }}
          path: dist/pulse-${{ steps.v.outputs.version }}.apk

      - name: Publish the release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          pre=""
          title="Pulse $v"
          if [ "${{ inputs.prerelease }}" = true ]; then pre="--prerelease"; title="Pulse $v (beta)"; fi
          gh release create "v$v" "dist/pulse-$v.apk" --target "$GITHUB_SHA" $pre \
            --title "$title" --generate-notes
